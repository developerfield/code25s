<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veri Seti İşleme Uygulaması</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 700px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .section {
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: #667eea;
            border-radius: 2px;
        }
        
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
            min-height: 80px;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f8f9ff;
        }
        
        .info-text {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            font-style: italic;
        }
        
        .operation-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .operation-select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-hesapla {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-hesapla:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-temizle {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-temizle:hover {
            background: #e0e0e0;
        }
        
        .result-box {
            background: #f8f9ff;
            border: 2px solid #667eea;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        
        .result-box.active {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .result-output {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            color: #333;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }
        
        .stat-item {
            background: white;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #d32f2f;
        }
        
        .error.active {
            display: block;
        }
        
        .success {
            background: #e0ffe0;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid #2e7d32;
        }
        
        .success.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Veri Seti İşleme Uygulaması</h1>
        
        <div class="section">
            <div class="section-title">Girdi Veri Seti</div>
            <textarea id="girdiBolum" placeholder="Örnek: 1,2,3,4,5 veya 1.5,2.3,3.7,4.2"></textarea>
            <p class="info-text">💡 Virgülle ayrılmış sayılar giriniz</p>
        </div>
        
        <div class="section">
            <div class="section-title">İşlem Seçin</div>
            <select id="islemSecim" class="operation-select">
                <option value="kare">((x*2)^2) - Çift al ve kare</option>
                <option value="kupuz">x^3 - Küp</option>
                <option value="karekop">√x - Karekök</option>
                <option value="sinx">sin(x) - Sinüs</option>
                <option value="cosx">cos(x) - Kosinüs</option>
                <option value="tanx">tan(x) - Tanjant</option>
                <option value="exp">e^x - Üstel</option>
                <option value="ln">ln(x) - Doğal Logaritma</option>
                <option value="log">log10(x) - 10 Tabanında Logaritma</option>
                <option value="ters">1/x - Ters</option>
                <option value="mutkook">|x| - Mutlak Değer</option>
                <option value="ozel">(x^2 - 3x + 2) - Özel Formül</option>
            </select>
            <p class="info-text">📐 Uygulanacak matematiksel işlemi seçiniz</p>
        </div>
        
        <div class="buttons">
            <button class="btn-hesapla" onclick="hesapla()">🔄 Hesapla</button>
            <button class="btn-temizle" onclick="temizle()">🗑️ Temizle</button>
        </div>
        
        <div id="hataMesaji" class="error"></div>
        <div id="basariMesaji" class="success"></div>
        
        <div id="sonucKutusu" class="result-box">
            <div class="section-title">Sonuç Veri Seti</div>
            <div class="result-output" id="sonucCikti"></div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Girdi Sayısı</div>
                    <div class="stat-value" id="girdilSayisi">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Çıktı Sayısı</div>
                    <div class="stat-value" id="ciktilSayisi">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Ortalama (Girdi)</div>
                    <div class="stat-value" id="girdilOrtala">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Ortalama (Çıktı)</div>
                    <div class="stat-value" id="ciktilOrtala">0</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function getGirdiler() {
            const metin = document.getElementById('girdiBolum').value.trim();
            if (!metin) return null;
            const sayilar = metin.split(',').map(s => {
                const temiz = s.trim();
                const sayi = parseFloat(temiz);
                return isNaN(sayi) ? null : sayi;
            }).filter(s => s !== null);
            return sayilar.length > 0 ? sayilar : null;
        }
        
        function islemUygula(x, operasyon) {
            switch(operasyon) {
                case 'kare':    return Math.pow(x * 2, 2);
                case 'kupuz':   return Math.pow(x, 3);
                case 'karekop': return x < 0 ? NaN : Math.sqrt(x);
                case 'sinx':    return Math.sin(x);
                case 'cosx':    return Math.cos(x);
                case 'tanx':    return Math.tan(x);
                case 'exp':     return Math.exp(x);
                case 'ln':      return x <= 0 ? NaN : Math.log(x);
                case 'log':     return x <= 0 ? NaN : Math.log10(x);
                case 'ters':    return x === 0 ? NaN : 1 / x;
                case 'mutkook': return Math.abs(x);
                case 'ozel':    return Math.pow(x, 2) - 3 * x + 2;
                default:        return x;
            }
        }
        
        function hesapla() {
            const hataMesaji = document.getElementById('hataMesaji');
            const basariMesaji = document.getElementById('basariMesaji');
            const sonucKutusu = document.getElementById('sonucKutusu');
            
            hataMesaji.classList.remove('active');
            basariMesaji.classList.remove('active');
            
            const girdiler = getGirdiler();
            if (!girdiler) {
                hataMesaji.textContent = '❌ Lütfen geçerli sayılar giriniz!';
                hataMesaji.classList.add('active');
                return;
            }
            
            const operasyon = document.getElementById('islemSecim').value;
            const ciktiler = girdiler.map(x => islemUygula(x, operasyon));
            
            if (ciktiler.some(isNaN)) {
                hataMesaji.textContent = '⚠️ Bazı işlemler tanımsız sonuç verdi!';
                hataMesaji.classList.add('active');
            }
            
            const ciktilerFormatlı = ciktiler.map(n => isNaN(n) ? 'NaN' : Number(n.toFixed(2)));
            document.getElementById('sonucCikti').textContent = ciktilerFormatlı.join(', ');
            
            const geçerliCiktiler = ciktiler.filter(n => !isNaN(n));
            const girdilOrt = (girdiler.reduce((a, b) => a + b, 0) / girdiler.length).toFixed(2);
            const ciktilOrt = geçerliCiktiler.length > 0
                ? (geçerliCiktiler.reduce((a, b) => a + b, 0) / geçerliCiktiler.length).toFixed(2)
                : 'N/A';
            
            document.getElementById('girdilSayisi').textContent = girdiler.length;
            document.getElementById('ciktilSayisi').textContent = ciktiler.length;
            document.getElementById('girdilOrtala').textContent = girdilOrt;
            document.getElementById('ciktilOrtala').textContent = ciktilOrt;
            
            sonucKutusu.classList.add('active');
            basariMesaji.textContent = '✅ İşlem başarıyla tamamlandı!';
            basariMesaji.classList.add('active');
        }
        
        function temizle() {
            document.getElementById('girdiBolum').value = '';
            document.getElementById('sonucKutusu').classList.remove('active');
            document.getElementById('hataMesaji').classList.remove('active');
            document.getElementById('basariMesaji').classList.remove('active');
        }
        
        document.getElementById('girdiBolum').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) hesapla();
        });
    </script>
</body>
</html>
