<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sıralı, Sürüklenebilir ve Düzenlenebilir Liste</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #2c2f33;
        color: #ffffff;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        background-color: #23272a;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 500px;
    }
    .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }
    input[type="text"], textarea {
        flex-grow: 1;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background-color: #ffffff;
        color: #333333;
        outline: none;
    }
    button {
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
        color: white;
    }
    .add-btn { background-color: #43b581; }
    .add-btn:hover { background-color: #3ca374; }
    .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background-color: #40444b;
        border-radius: 5px;
        cursor: grab;
        user-select: none;
        transition: background-color 0.2s;
    }
    .item:active { cursor: grabbing; }
    .item.dragging {
        opacity: 0.5;
        background-color: #555b63;
        border: 2px dashed #7289da;
    }
    
    .delete-btn-tiny {
        background-color: #f04747;
        color: white;
        border: none;
        border-radius: 3px;
        width: 20px;       
        height: 20px;      
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;   
        cursor: pointer;
        margin-right: 10px; 
        flex-shrink: 0;
        padding: 0;
    }
    .delete-btn-tiny:hover { background-color: #d84040; }

    .item-number {
        background-color: #7289da;
        color: white;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        font-weight: bold;
        margin-right: 15px;
        flex-shrink: 0;
    }
    .item-text {
        flex-grow: 1;
        font-size: 16px;
        margin-right: 15px;
        word-break: break-word;
        cursor: pointer; /* Metnin üzerine gelince tıklanabilir olduğunu hissettirir */
    }
    .edit-input {
        flex-grow: 1;
        font-size: 16px;
        padding: 5px;
        margin-right: 15px;
        border: 2px solid #7289da;
        border-radius: 4px;
        background-color: #ffffff;
        color: #333333;
        outline: none;
    }
    .btn-group {
        display: flex;
        gap: 5px;
    }
    .move-btn {
        background-color: #4f545c;
        padding: 8px 12px;
        font-size: 14px;
    }
    .move-btn:hover { background-color: #7289da; }
    
    .export-section {
        margin-top: 25px;
        border-top: 1px solid #40444b;
        padding-top: 20px;
    }
    .export-btn {
        background-color: #7289da;
        width: 100%;
        margin-bottom: 10px;
    }
    .export-btn:hover { background-color: #5b6eae; }
    #outputText {
        width: 100%;
        height: 120px;
        display: none;
        resize: vertical;
        box-sizing: border-box;
    }
</style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <input type="text" id="itemInput" placeholder="Yeni başlık ekle...">
        <button class="add-btn" onclick="addItem()">Ekle</button>
    </div>
    <div style="font-size: 12px; color: #b9bbbe; margin-bottom: 15px; text-align: center;">
        * Düzenlemek için metnin üzerine basılı tutun.
    </div>
    
    <div class="list" id="sortableList"></div>

    <div class="export-section">
        <button class="export-btn" onclick="exportList()">Listeyi Çıktı Al</button>
        <textarea id="outputText" readonly placeholder="Çıktı burada görünecek..."></textarea>
    </div>
</div>

<script>
    const list = document.getElementById('sortableList');
    const input = document.getElementById('itemInput');
    const outputText = document.getElementById('outputText');
    let draggedItem = null;

    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addItem();
    });

    function updateNumbers() {
        const numbers = list.querySelectorAll('.item-number');
        numbers.forEach((numSpan, index) => {
            numSpan.textContent = index + 1;
        });
    }

    function addItem() {
        const text = input.value.trim();
        if (text === '') return;

        const div = document.createElement('div');
        div.className = 'item';
        div.draggable = true;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn-tiny';
        deleteBtn.innerHTML = '✖';
        deleteBtn.title = 'Sil';
        deleteBtn.onclick = function(e) {
            e.stopPropagation();
            div.remove();
            updateNumbers();
            outputText.style.display = 'none';
        };

        const numSpan = document.createElement('span');
        numSpan.className = 'item-number';

        const textSpan = document.createElement('span');
        textSpan.className = 'item-text';
        textSpan.textContent = text;
        textSpan.title = "Düzenlemek için basılı tutun";

        // Basılı tutarak düzenleme işlemi (Long Press Event)
        let pressTimer;

        function startPress() {
            pressTimer = setTimeout(() => {
                enableEditing(textSpan, div);
            }, 600); // 600 milisaniye basılı tutulursa düzenleme açılır
        }

        function cancelPress() {
            clearTimeout(pressTimer);
        }

        textSpan.addEventListener('mousedown', startPress);
        textSpan.addEventListener('touchstart', startPress);
        
        textSpan.addEventListener('mouseup', cancelPress);
        textSpan.addEventListener('mouseleave', cancelPress);
        textSpan.addEventListener('touchend', cancelPress);
        textSpan.addEventListener('touchmove', cancelPress);

        const btnGroup = document.createElement('div');
        btnGroup.className = 'btn-group';

        const upBtn = document.createElement('button');
        upBtn.className = 'move-btn';
        upBtn.innerHTML = '▲';
        upBtn.title = 'Yukarı Taşı';
        upBtn.onclick = function(e) {
            e.stopPropagation();
            const prev = div.previousElementSibling;
            if (prev) {
                list.insertBefore(div, prev);
                updateNumbers();
                outputText.style.display = 'none';
            }
        };

        const downBtn = document.createElement('button');
        downBtn.className = 'move-btn';
        downBtn.innerHTML = '▼';
        downBtn.title = 'Aşağı Taşı';
        downBtn.onclick = function(e) {
            e.stopPropagation();
            const next = div.nextElementSibling;
            if (next) {
                list.insertBefore(next, div);
                updateNumbers();
                outputText.style.display = 'none';
            }
        };

        btnGroup.appendChild(upBtn);
        btnGroup.appendChild(downBtn);

        div.appendChild(deleteBtn);
        div.appendChild(numSpan);
        div.appendChild(textSpan);
        div.appendChild(btnGroup);
        
        list.appendChild(div);

        addDragEvents(div);
        input.value = '';
        updateNumbers();
        outputText.style.display = 'none';
    }

    // Düzenleme fonksiyonu
    function enableEditing(textSpan, listItem) {
        listItem.draggable = false; // Düzenleme sırasında sürüklemeyi kapat

        const currentText = textSpan.textContent;
        const editInput = document.createElement('input');
        editInput.type = 'text';
        editInput.className = 'edit-input';
        editInput.value = currentText;

        // textSpan'i input ile değiştir
        listItem.replaceChild(editInput, textSpan);
        editInput.focus();

        function saveEdit() {
            const newText = editInput.value.trim();
            if (newText !== '') {
                textSpan.textContent = newText;
            }
            // input'u tekrar textSpan ile değiştir
            if (listItem.contains(editInput)) {
                listItem.replaceChild(textSpan, editInput);
            }
            listItem.draggable = true; // Sürüklemeyi tekrar aç
            outputText.style.display = 'none';
        }

        // Tıklama dışarı çıkınca veya Enter'a basılınca kaydet
        editInput.addEventListener('blur', saveEdit);
        editInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveEdit();
        });
    }

    function addDragEvents(item) {
        item.addEventListener('dragstart', function() {
            draggedItem = item;
            setTimeout(() => item.classList.add('dragging'), 0);
        });

        item.addEventListener('dragend', function() {
            draggedItem.classList.remove('dragging');
            draggedItem = null;
            updateNumbers();
            outputText.style.display = 'none';
        });
    }

    list.addEventListener('dragover', function(e) {
        e.preventDefault();
        const afterElement = getDragAfterElement(list, e.clientY);
        const dragging = document.querySelector('.dragging');
        
        if (dragging) {
            if (afterElement == null) {
                list.appendChild(dragging);
            } else {
                list.insertBefore(dragging, afterElement);
            }
        }
    });

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function exportList() {
        const items = list.querySelectorAll('.item-text');
        if (items.length === 0) {
            outputText.value = "Liste boş.";
        } else {
            let result = "";
            items.forEach((item, index) => {
                result += `${index + 1}. ${item.textContent}\n`;
            });
            outputText.value = result.trim();
        }
        outputText.style.display = 'block';
    }
</script>

</body>
</html>
