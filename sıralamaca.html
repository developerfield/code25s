<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sürüklenebilir Liste</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #2c2f33;
        color: #ffffff;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
    }
    .container {
        background-color: #23272a;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 500px;
    }
    .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }
    input[type="text"] {
        flex-grow: 1;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        background-color: #ffffff;
        color: #333333;
        outline: none;
    }
    button.add-btn {
        padding: 12px 20px;
        font-size: 16px;
        background-color: #43b581;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    button.add-btn:hover {
        background-color: #3ca374;
    }
    .list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        background-color: #40444b;
        border-radius: 5px;
        cursor: grab;
        user-select: none;
        transition: background-color 0.2s, transform 0.1s;
    }
    .item:active {
        cursor: grabbing;
    }
    .item.dragging {
        opacity: 0.5;
        background-color: #555b63;
        border: 2px dashed #7289da;
    }
    .item-text {
        flex-grow: 1;
        font-size: 16px;
        margin-right: 15px;
    }
    .delete-btn {
        background-color: #f04747;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .delete-btn:hover {
        background-color: #d84040;
    }
</style>
</head>
<body>

<div class="container">
    <div class="input-group">
        <input type="text" id="itemInput" placeholder="Yeni başlık ekle...">
        <button class="add-btn" onclick="addItem()">Ekle</button>
    </div>
    <div class="list" id="sortableList">
        <!-- Eklenen başlıklar burada görünecek -->
    </div>
</div>

<script>
    const list = document.getElementById('sortableList');
    const input = document.getElementById('itemInput');
    let draggedItem = null;

    // Enter tuşuna basıldığında ekleme işlemini tetikle
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') addItem();
    });

    // Yeni başlık ekleme fonksiyonu
    function addItem() {
        const text = input.value.trim();
        if (text === '') return;

        const div = document.createElement('div');
        div.className = 'item';
        div.draggable = true; // Sürüklenebilir özelliği aktif et

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = text;

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = 'Sil';
        
        // Silme işlemi
        deleteBtn.onclick = function() {
            div.remove();
        };

        div.appendChild(span);
        div.appendChild(deleteBtn);
        list.appendChild(div);

        addDragEvents(div); // Sürükleme olaylarını yeni öğeye ata
        input.value = ''; // Girdi kutusunu temizle
    }

    // Sürükle ve bırak (Drag & Drop) olay yöneticisi
    function addDragEvents(item) {
        item.addEventListener('dragstart', function(e) {
            draggedItem = item;
            // Sürükleme başladığında görsel efekt için sınıf ekle
            setTimeout(() => item.classList.add('dragging'), 0);
        });

        item.addEventListener('dragend', function() {
            draggedItem.classList.remove('dragging');
            draggedItem = null;
        });
    }

    // Listenin üzerinde sürüklenirken sıralamayı belirle
    list.addEventListener('dragover', function(e) {
        e.preventDefault(); // Varsayılan bırakma engellemesini kaldır
        const afterElement = getDragAfterElement(list, e.clientY);
        const dragging = document.querySelector('.dragging');
        
        if (afterElement == null) {
            list.appendChild(dragging);
        } else {
            list.insertBefore(dragging, afterElement);
        }
    });

    // Farenin Y eksenindeki konumuna göre hangi elemanın altına/üstüne geleceğini hesapla
    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.item:not(.dragging)')];

        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else {
                return closest;
            }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }
</script>

</body>
</html>
